name: QMS Hub CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Automated Compliance & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django System & Deployment Checks
      env:
        SECRET_KEY: "ci-secret-key-for-automated-github-actions-testing-only"
        DEBUG: "True"
      run: |
        python manage.py check

    - name: Run 32 Automated Unit Tests (19 Apps)
      env:
        SECRET_KEY: "ci-secret-key-for-automated-github-actions-testing-only"
        DEBUG: "True"
      run: |
        python manage.py test

  docker-build:
    name: Docker Containerization Integrity
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: qms-hub:latest
