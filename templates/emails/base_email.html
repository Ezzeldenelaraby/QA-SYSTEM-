<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ email_title|default:"QMS System Alert" }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #212529;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .email-header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 24px;
            text-align: left;
            border-bottom: 3px solid #0d6efd;
        }
        .header-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-subtitle {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #94a3b8;
        }
        .email-body {
            padding: 28px 24px;
        }
        .alert-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .badge-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-warning { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .badge-info { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
        .badge-success { background-color: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }
        .data-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            width: 35%;
        }
        .data-table td {
            color: #0f172a;
            font-weight: 500;
        }
        .btn-action {
            display: inline-block;
            background-color: #0d6efd;
            color: #ffffff !important;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
        .email-footer {
            background-color: #f8fafc;
            padding: 16px 24px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1 class="header-title">🛡️ {{ platform_name|default:"INDUSTRIAL QMS HUB" }}</h1>
            <p class="header-subtitle">ISO 9001:2015 & IATF 16949 Compliant Quality Management</p>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p style="margin: 0;">This is an automated operational notice generated by Industrial QMS Hub.</p>
            <p style="margin: 4px 0 0 0;">Please do not reply directly to this email.</p>
        </div>
    </div>
</body>
</html>
